# Dependabot version updates (M13-02, EX-0002 finding F-1).
#
# Scope note (recorded so the gate is reproducible from the codebase, not from
# invisible account settings): this file governs scheduled VERSION updates only.
# Dependabot *security* updates and Dependabot *alerts* are repo/account toggles.
# Both were ENABLED by Carlos on 2026-08-04 (`gh api .../vulnerability-alerts` =
# 204 and security_and_analysis.dependabot_security_updates = "enabled"); this
# note previously said DISABLED and was stale from M13-02 until M14-01 corrected
# it. Those two toggles do not affect either active GATE here. Note a SEPARATE
# repo feature does gate one of them: dependency-review needs the Dependency
# GRAPH enabled (dependency-scanning.md tracks it as a precondition); the
# scheduled pnpm audit needs no GitHub feature at all.
#
# Ceremony-budget bias (AC 6): under branch protection EVERY Dependabot PR needs
# Carlos's explicit merge word, so routine minor/patch bumps are GROUPED into one
# PR per ecosystem per week and the open-PR limit is capped low. Security-relevant
# major bumps still open individually so they are not buried in a group.
version: 2

updates:
  # Application + workspace npm dependencies. One grouped routine PR/week keeps the
  # every-PR-needs-a-merge-word queue small; majors break out on their own.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Version cooldown (M14-01; rationale + the full story record in
    # docs/BACKLOG.md). Dependabot will not PROPOSE a version until it is 7 days
    # old, matching the pnpm minimumReleaseAge floor of 10080 minutes in
    # pnpm-workspace.yaml. CONSISTENCY LAW: keep these two equal or keep
    # dependabot-days >= pnpm-minutes/1440, so Dependabot never opens a PR whose
    # target this repo's own resolver would then refuse.
    # This applies to VERSION updates ONLY - GitHub's docs are explicit that
    # "The `cooldown` option is only available for *version* updates, not
    # *security* updates", which is the intended fast path for urgent fixes.
    # Note the pnpm floor has NO such carve-out: see the SECURITY OVERRIDE
    # procedure in pnpm-workspace.yaml before merging a security bump.
    cooldown:
      default-days: 7
    groups:
      routine-npm:
        update-types:
          - minor
          - patch
    # @types/node MAJOR bumps ride a deliberate runtime-major story only (M13-12
    # #150 remedy, Carlos-worded). Catalog policy pins @types/node's major to the
    # .nvmrc Node major, because a types-only major can advertise runtime APIs the
    # installed Node lacks (Dependabot #150 proposed @types/node 26 on the node-24
    # runtime and was stopped for exactly this). Minor/patch @types/node keep
    # flowing through routine-npm above; a major moves only with a runtime bump.
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  # The workflow files themselves pin actions by major tag (checkout@v7, etc.);
  # this keeps those pins current and is the surface a supply-chain compromise of
  # a third-party action would first touch.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    # Same 7-day cooldown as npm above (M14-01). A compromised third-party action
    # is the fastest path into this repo's CI, so the same waiting period applies;
    # github-actions supports `default-days` per GitHub's options reference.
    cooldown:
      default-days: 7
    groups:
      routine-actions:
        update-types:
          - minor
          - patch
