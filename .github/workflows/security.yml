name: security

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0 # scan full history — a secret in any commit is burned
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  profile-guard:
    name: private profile data absent
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      # The guard is a tracked script, not inline shell: the inline form carried
      # three proven bypasses (C-quoted paths, case variants, docs/profile as a
      # file) and had no way to be plant-tested. scripts/profile-guard-plants.sh
      # is its planted-FAIL suite; --legacy re-runs the old inline logic and
      # shows these plants kill it.
      - name: Fail if docs/profile is tracked (any byte/case disguise)
        run: bash scripts/profile-guard.sh
