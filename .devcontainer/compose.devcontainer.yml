# Devcontainer overlay for the root docker-compose.yml (devcontainer.json
# loads both files; this one adds the workspace container).
#
# The devcontainer CLI reuses the repo's compose project name, so this joins
# the SAME project as a host-side `docker compose up -d`: one shared postgres
# service and pgdata volume. Deliberately NO overrides on the postgres
# service: any overlay diff on a shared service makes host-side and
# devcontainer `up`s flip-flop its config (recreating the container each
# time). network_mode joins postgres's network namespace, so localhost:5432
# works identically to the host and .env needs no container-specific edits.
# The host-published side of that mapping is `${POSTGRES_PORT}:5432` and now
# defaults to 4610 (project port block 4600-4999); the CONTAINER side stays
# 5432, so in-container clients and DATABASE_URL need no change.
#
# PATH RULE for this file: docker compose resolves relative paths in merged
# files from the FIRST file's directory (the repo root), NOT from this
# file's own directory.
#
# ---------------------------------------------------------------------------
# HOST-IDENTICAL ABSOLUTE PATHS - the single most important thing in this file
# ---------------------------------------------------------------------------
# The repo is bind-mounted at /Users/carlos/code/careerforge INSIDE the
# container - the same absolute path it has on the host - and the worktree root
# at /Users/carlos/code/careerforge-worktrees likewise. That is not aesthetic:
# it is the only scheme under which one set of git worktrees is usable from
# BOTH sides.
#
# Git worktree metadata is absolute on both ends. A worktree's `.git` file
# holds `gitdir: <main>/.git/worktrees/<name>`, and that admin directory's
# `gitdir` file holds `<worktree>/.git`. Mount the repo anywhere else in the
# container and every one of those pointers is wrong from one side or the
# other: `git worktree list` reports the container's worktrees as prunable on
# the host, and `git status` inside a seat fails outright.
#
# The obvious fix does NOT work here. git's `worktree.useRelativePaths` (and
# its `relativeWorktrees` repository extension) needs git >= 2.48; the
# node:24-bookworm base ships git 2.39.5, which does not merely ignore the
# extension - it REJECTS THE WHOLE REPOSITORY with "unknown repository
# extension found: relativeworktrees". Turning it on would make the repo
# unreadable inside the container. Measured, not assumed.
#
# So the paths are hardcoded, and hardcoded means machine-specific by design.
# A different host home directory needs this file, devcontainer.json's
# workspaceFolder, devcontainer-init.sh's roots and gen-seat-volumes.sh's
# WORKTREE_ROOT changed together. Compose interpolation (${HOME}) was rejected
# for the target side: devcontainer.json cannot use it, and two files silently
# resolving to different strings is exactly the failure this scheme exists to
# prevent.
#
# /workspaces/careerforge and /workspaces/careerforge-worktrees remain as
# SYMLINKS to the real paths (created in the Dockerfile), so older docs, notes
# and muscle memory still land somewhere correct.
services:
  devcontainer:
    build:
      # Repo-root-relative (see PATH RULE): `.` here would silently build
      # the repo's production Dockerfile instead.
      context: .devcontainer
      dockerfile: Dockerfile
    init: true
    # Chromium under docker defaults to a 64MB /dev/shm and tab-crashes under
    # Lighthouse's multi-page runs; 1GB removes that flake source in-container
    # (CI runners are unaffected - their /dev/shm is large). Unchanged by the
    # single-container move: the figure is per-Chromium-process, not per-lane.
    shm_size: 1gb
    # mem_limit is a CEILING, not a reservation: docker sets a cgroup maximum
    # and reserves nothing, so only the actual resident set competes for the
    # VM's memory.
    #
    # RAISED 6g -> 10g with the six-seat fleet retired. The old figure bounded
    # the blast radius of ONE lane out of six sharing a 16GiB colima VM
    # (`colima list`: default, 8 CPUs, 16GiB, running). There is now exactly
    # one devcontainer, and its neighbours in the VM are postgres (a few
    # hundred MiB) and the VM itself. 10g leaves roughly 6GiB of headroom
    # rather than sizing the ceiling to a fleet that no longer exists.
    #
    # NOT 12g: that would leave under 4GiB for the VM plus postgres plus
    # whatever else colima is hosting (this VM also runs a k3s control plane -
    # coredns, metrics-server, local-path-provisioner), and the ceiling is a
    # blast-radius bound, not a target to max out.
    #
    # The term that actually sets memory usage is NODE_OPTIONS heap x
    # concurrently BUILDING seats. Below, --max-old-space-size=3072 lets one
    # node process grow a 3GiB old space; a seat that is actively building runs
    # roughly one such process plus a Chromium burst (Lighthouse/axe, ~1GiB
    # with the 1GB /dev/shm above), so it peaks near 4.5-5GiB. Five seats now
    # share ONE cgroup, so this ceiling bounds them collectively: two seats can
    # build at once inside 10g, three cannot. If seats must build in parallel
    # more often, lower NODE_OPTIONS first (it is the term that scales), not
    # this ceiling.
    mem_limit: 10g
    cap_add:
      - NET_ADMIN
      - NET_RAW
    network_mode: service:postgres
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      # The repo, at its host-identical absolute path (see the header). Source
      # is repo-root-relative (see PATH RULE): beware that `..` here WOULD
      # mount the parent of the repo (all of ~/code) into the container -
      # `.` below is correct and deliberate.
      - .:/Users/carlos/code/careerforge:delegated
      # The seat worktree root, also at its host-identical absolute path.
      # Read-write: seats commit here, and the host reads those commits back
      # out of the shared .git in the main checkout. The host directory must
      # already exist and hold real worktrees before `devcontainer up` - see
      # init-seat-worktrees.sh. If it does not, docker happily creates
      # root-owned empty directories under it to satisfy the nm-* mounts
      # below, and `git worktree add` then refuses the path as non-empty.
      - /Users/carlos/code/careerforge-worktrees:/Users/carlos/code/careerforge-worktrees:delegated
      # The v2-ops coordination bus. Mounted at the same path shape as the
      # host (~/careerforge-v2-ops) so seat docs resolve identically in both
      # worlds. Read-write on purpose: the bus IS the sanctioned cross-seat
      # channel (INBOX writes, DISPATCH flips); it is git-versioned on the
      # host, so any write is recoverable. This widens the sandbox by exactly
      # this one directory - egress policy and the rest of the host stay
      # unreachable. gh credentials deliberately do NOT follow: merge ceremony
      # runs on the host only.
      - ${HOME:?}/careerforge-v2-ops:/home/node/careerforge-v2-ops:delegated
      # The dispatch STATE root (claims, generations, heartbeats, work items,
      # events - see careerforge-v2-ops CONTRACT). Lives OUTSIDE every git
      # worktree on purpose: a `git clean -fdx`/`git stash -a` in the ops repo
      # must never be able to delete claims or fence counters (verified
      # destructive on gitignored in-tree state, 2026-08-17). Same path shape
      # both worlds, like the ops bus above.
      - ${HOME:?}/careerforge-state:/home/node/careerforge-state:delegated
      - claude-config:/home/node/.claude
      - shell-history:/commandhistory
      # ONE pnpm content-addressable store, shared by the main tree and all
      # five seat worktrees. The first tree to install pays for the download;
      # every other tree resolves entirely out of this store. MEASURED
      # 2026-08-25: seat a1-resume cold, "reused 0, downloaded 1297", 6.5s;
      # seat a2-coaching immediately after, "reused 1297, downloaded 0", 2.5s.
      # Store PATH is set by PNPM_CONFIG_STORE_DIR in the environment block;
      # the two must agree or this volume is dead weight.
      #
      # WHAT THIS DOES NOT BUY - hardlinks. pnpm's fast path is hardlink(2)
      # from the store into node_modules, and it does not work here.
      # MEASURED in this container, same date: `ln` from a file on this volume
      # to a path on nm-a2-coaching-root fails with EXDEV "Invalid cross-device
      # link", even though both report st_dev 64785 (/dev/vdb1) - the kernel
      # refuses a hardlink whose two ends are on different MOUNTS, and every
      # docker named volume is its own mount. pnpm's package-import-method
      # default ("auto") falls back to copy silently, so nothing errors; the
      # cost is disk, roughly 785MB of node_modules per seat on top of the
      # 697MB store. Do not "fix" this by dropping the per-seat node_modules
      # volumes - see the note below for why they exist. It is bounded and
      # acceptable on a 100GiB VM disk.
      - pnpm-store:/home/node/.pnpm-store
      # Container-private node_modules: shadow every workspace package's
      # node_modules with a named volume. One node_modules cannot serve both
      # the macOS host and the Linux container: pnpm records the store path
      # and purges the whole dir on mismatch, stranding whichever side ran
      # install last (ERR_PNPM_ABORTED_REMOVE_MODULES_DIR_NO_TTY).
      #
      # This applies to the seat worktrees too, and for a sharper reason: the
      # worktrees are bind-mounted from the host, so WITHOUT the shadowing
      # below a container-side `pnpm install` in a seat would write a Linux
      # node_modules straight into the host tree.
      - nm-root:/Users/carlos/code/careerforge/node_modules
      - nm-apps-api:/Users/carlos/code/careerforge/apps/api/node_modules
      - nm-apps-portfolio:/Users/carlos/code/careerforge/apps/portfolio/node_modules
      - nm-apps-web:/Users/carlos/code/careerforge/apps/web/node_modules
      - nm-packages-config:/Users/carlos/code/careerforge/packages/config/node_modules
      - nm-packages-core:/Users/carlos/code/careerforge/packages/core/node_modules
      - nm-packages-db:/Users/carlos/code/careerforge/packages/db/node_modules
      - nm-packages-llm:/Users/carlos/code/careerforge/packages/llm/node_modules
      - nm-packages-resume-render:/Users/carlos/code/careerforge/packages/resume-render/node_modules
      - nm-packages-scoring:/Users/carlos/code/careerforge/packages/scoring/node_modules
      # Everything between the markers is written by gen-seat-volumes.sh.
      # Do not hand-edit: change the SEATS/PKGS arrays there, run --write.
      # >>> BEGIN GENERATED seat node_modules mounts (gen-seat-volumes.sh) >>>
      - nm-a1-resume-root:/Users/carlos/code/careerforge-worktrees/a1-resume/node_modules
      - nm-a1-resume-apps-api:/Users/carlos/code/careerforge-worktrees/a1-resume/apps/api/node_modules
      - nm-a1-resume-apps-portfolio:/Users/carlos/code/careerforge-worktrees/a1-resume/apps/portfolio/node_modules
      - nm-a1-resume-apps-web:/Users/carlos/code/careerforge-worktrees/a1-resume/apps/web/node_modules
      - nm-a1-resume-packages-config:/Users/carlos/code/careerforge-worktrees/a1-resume/packages/config/node_modules
      - nm-a1-resume-packages-core:/Users/carlos/code/careerforge-worktrees/a1-resume/packages/core/node_modules
      - nm-a1-resume-packages-db:/Users/carlos/code/careerforge-worktrees/a1-resume/packages/db/node_modules
      - nm-a1-resume-packages-llm:/Users/carlos/code/careerforge-worktrees/a1-resume/packages/llm/node_modules
      - nm-a1-resume-packages-resume-render:/Users/carlos/code/careerforge-worktrees/a1-resume/packages/resume-render/node_modules
      - nm-a1-resume-packages-scoring:/Users/carlos/code/careerforge-worktrees/a1-resume/packages/scoring/node_modules
      - nm-a2-coaching-root:/Users/carlos/code/careerforge-worktrees/a2-coaching/node_modules
      - nm-a2-coaching-apps-api:/Users/carlos/code/careerforge-worktrees/a2-coaching/apps/api/node_modules
      - nm-a2-coaching-apps-portfolio:/Users/carlos/code/careerforge-worktrees/a2-coaching/apps/portfolio/node_modules
      - nm-a2-coaching-apps-web:/Users/carlos/code/careerforge-worktrees/a2-coaching/apps/web/node_modules
      - nm-a2-coaching-packages-config:/Users/carlos/code/careerforge-worktrees/a2-coaching/packages/config/node_modules
      - nm-a2-coaching-packages-core:/Users/carlos/code/careerforge-worktrees/a2-coaching/packages/core/node_modules
      - nm-a2-coaching-packages-db:/Users/carlos/code/careerforge-worktrees/a2-coaching/packages/db/node_modules
      - nm-a2-coaching-packages-llm:/Users/carlos/code/careerforge-worktrees/a2-coaching/packages/llm/node_modules
      - nm-a2-coaching-packages-resume-render:/Users/carlos/code/careerforge-worktrees/a2-coaching/packages/resume-render/node_modules
      - nm-a2-coaching-packages-scoring:/Users/carlos/code/careerforge-worktrees/a2-coaching/packages/scoring/node_modules
      - nm-b1-portfolio-root:/Users/carlos/code/careerforge-worktrees/b1-portfolio/node_modules
      - nm-b1-portfolio-apps-api:/Users/carlos/code/careerforge-worktrees/b1-portfolio/apps/api/node_modules
      - nm-b1-portfolio-apps-portfolio:/Users/carlos/code/careerforge-worktrees/b1-portfolio/apps/portfolio/node_modules
      - nm-b1-portfolio-apps-web:/Users/carlos/code/careerforge-worktrees/b1-portfolio/apps/web/node_modules
      - nm-b1-portfolio-packages-config:/Users/carlos/code/careerforge-worktrees/b1-portfolio/packages/config/node_modules
      - nm-b1-portfolio-packages-core:/Users/carlos/code/careerforge-worktrees/b1-portfolio/packages/core/node_modules
      - nm-b1-portfolio-packages-db:/Users/carlos/code/careerforge-worktrees/b1-portfolio/packages/db/node_modules
      - nm-b1-portfolio-packages-llm:/Users/carlos/code/careerforge-worktrees/b1-portfolio/packages/llm/node_modules
      - nm-b1-portfolio-packages-resume-render:/Users/carlos/code/careerforge-worktrees/b1-portfolio/packages/resume-render/node_modules
      - nm-b1-portfolio-packages-scoring:/Users/carlos/code/careerforge-worktrees/b1-portfolio/packages/scoring/node_modules
      - nm-b2-web-root:/Users/carlos/code/careerforge-worktrees/b2-web/node_modules
      - nm-b2-web-apps-api:/Users/carlos/code/careerforge-worktrees/b2-web/apps/api/node_modules
      - nm-b2-web-apps-portfolio:/Users/carlos/code/careerforge-worktrees/b2-web/apps/portfolio/node_modules
      - nm-b2-web-apps-web:/Users/carlos/code/careerforge-worktrees/b2-web/apps/web/node_modules
      - nm-b2-web-packages-config:/Users/carlos/code/careerforge-worktrees/b2-web/packages/config/node_modules
      - nm-b2-web-packages-core:/Users/carlos/code/careerforge-worktrees/b2-web/packages/core/node_modules
      - nm-b2-web-packages-db:/Users/carlos/code/careerforge-worktrees/b2-web/packages/db/node_modules
      - nm-b2-web-packages-llm:/Users/carlos/code/careerforge-worktrees/b2-web/packages/llm/node_modules
      - nm-b2-web-packages-resume-render:/Users/carlos/code/careerforge-worktrees/b2-web/packages/resume-render/node_modules
      - nm-b2-web-packages-scoring:/Users/carlos/code/careerforge-worktrees/b2-web/packages/scoring/node_modules
      - nm-review-seat-root:/Users/carlos/code/careerforge-worktrees/review-seat/node_modules
      - nm-review-seat-apps-api:/Users/carlos/code/careerforge-worktrees/review-seat/apps/api/node_modules
      - nm-review-seat-apps-portfolio:/Users/carlos/code/careerforge-worktrees/review-seat/apps/portfolio/node_modules
      - nm-review-seat-apps-web:/Users/carlos/code/careerforge-worktrees/review-seat/apps/web/node_modules
      - nm-review-seat-packages-config:/Users/carlos/code/careerforge-worktrees/review-seat/packages/config/node_modules
      - nm-review-seat-packages-core:/Users/carlos/code/careerforge-worktrees/review-seat/packages/core/node_modules
      - nm-review-seat-packages-db:/Users/carlos/code/careerforge-worktrees/review-seat/packages/db/node_modules
      - nm-review-seat-packages-llm:/Users/carlos/code/careerforge-worktrees/review-seat/packages/llm/node_modules
      - nm-review-seat-packages-resume-render:/Users/carlos/code/careerforge-worktrees/review-seat/packages/resume-render/node_modules
      - nm-review-seat-packages-scoring:/Users/carlos/code/careerforge-worktrees/review-seat/packages/scoring/node_modules
      # <<< END GENERATED seat node_modules mounts <<<
    environment:
      CLAUDE_CONFIG_DIR: /home/node/.claude
      # Carlos's wall clock (Oklahoma) for EVERY process in the seat - date,
      # git timestamps, logs, statusline. IANA zone, so daylight saving flips
      # automatically (CDT<->CST); never replace with a hardcoded offset.
      TZ: America/Chicago
      # Docker VM memory is a fraction of the host's; cap node heaps so
      # install-time build scripts can't blow past it (same cap the
      # reference devcontainer uses). THIS is the term that sets the real
      # memory budget - see the mem_limit comment above: peak is roughly this
      # value times the number of seats building at once, and this is the
      # number to lower if seats must build in parallel.
      NODE_OPTIONS: --max-old-space-size=3072
      # Keep pnpm's store INSIDE the container, on the shared pnpm-store
      # volume mounted above. The bind-mounted workspace is a different
      # filesystem from the container home, so pnpm otherwise relocates its
      # store to .pnpm-store/ in the repo - which leaks onto the host tree
      # (and broke `prettier --check .`). Must equal the pnpm-store mount
      # target above.
      #
      # PNPM_CONFIG_*, NOT npm_config_*. pnpm 11 stopped reading the
      # npm_config_ prefix; the old spelling was silently dead. MEASURED in
      # this container on 2026-08-25 with the repo's pinned pnpm 11.12.0:
      #   npm_config_store_dir=/home/node/.pnpm-store
      #     -> pnpm store path = /Users/carlos/code/careerforge/.pnpm-store/v11
      #        (686MB of store written into the host repo tree)
      #   PNPM_CONFIG_STORE_DIR=/home/node/.pnpm-store
      #     -> pnpm store path = /home/node/.pnpm-store/v11
      # Do not "restore" the npm_config_ spelling; it looks correct and does
      # nothing.
      PNPM_CONFIG_STORE_DIR: /home/node/.pnpm-store
      # node_modules volumes are container-private, so a store-path change
      # purging them is always safe; without this, pnpm aborts for lack of a
      # TTY (ERR_PNPM_ABORTED_REMOVE_MODULES_DIR_NO_TTY). Both spellings are
      # set: unlike store-dir, this key is not reported by `pnpm config get`
      # under either prefix, so which one pnpm 11 honours could not be
      # measured directly - and a wrong guess only shows up as a hung
      # non-interactive install.
      PNPM_CONFIG_CONFIRM_MODULES_PURGE: 'false'
      npm_config_confirm_modules_purge: 'false'
    command: sleep infinity

volumes:
  # Unnamed, so compose prefixes it with the project name. Under the retired
  # six-seat fleet this was the fix for six containers pooling one Claude
  # config volume: 73 pooled transcripts, one history.jsonl, one .claude.json
  # rewritten read-modify-write by six containers (last writer wins), and every
  # seat's session named identically, which made `--resume` a coin flip.
  #
  # With ONE container the volume is shared by construction, and that is fine
  # BECAUSE Claude Code keys its per-project state on the workspace path: the
  # five seats live at five distinct absolute paths under
  # /Users/carlos/code/careerforge-worktrees, so they still get five distinct
  # project directories inside this one volume. The invariant that mattered
  # was never "one volume per container" - it was "one project path per seat".
  #
  # COST, stated rather than left to be discovered: the container's Claude
  # sign-in lives here. .devcontainer/seed-claude-volume.sh copies the
  # credential (plus settings.json and statusline-command.sh) in host-side.
  claude-config:
  shell-history:
  # Shared pnpm content-addressable store - see the mount comment above.
  pnpm-store:
  nm-root:
  nm-apps-api:
  nm-apps-portfolio:
  nm-apps-web:
  nm-packages-config:
  nm-packages-core:
  nm-packages-db:
  nm-packages-llm:
