# Devcontainer overlay for the root docker-compose.yml (devcontainer.json
# loads both files; this one adds the workspace container).
#
# The devcontainer CLI reuses the repo's compose project name, so this joins
# the SAME project as a host-side `docker compose up -d`: one shared postgres
# service and pgdata volume. Deliberately NO overrides on the postgres
# service: any overlay diff on a shared service makes host-side and
# devcontainer `up`s flip-flop its config (recreating the container each
# time). network_mode joins postgres's network namespace, so localhost:5432
# works identically to the host and .env needs no container-specific edits.
# A clone's .env moving POSTGRES_PORT off 5432 changes ONLY the
# host-published side of the `${POSTGRES_PORT}:5432` mapping (each clone
# must claim its own registry port - two compose projects cannot publish
# one host port); the container-side port stays 5432, so in-container
# clients and DATABASE_URL need no change.
#
# PATH RULE for this file: docker compose resolves relative paths in merged
# files from the FIRST file's directory (the repo root), NOT from this
# file's own directory.
#
# PER-SEAT WORKSPACE PATH - why ${COMPOSE_PROJECT_NAME} and not
# ${localWorkspaceFolderBasename}. devcontainer.json uses the latter, because
# the devcontainer CLI substitutes devcontainer.json variables itself. It does
# NOT substitute compose files: it hands their PATHS to `docker compose` and
# compose does its own interpolation, which has never heard of any
# devcontainer variable (verified in @devcontainers/cli 0.88.0 - the compose
# files are only ever resolved to paths and passed through with -f). The
# variable both worlds DO agree on is the compose project name:
#   - `devcontainer up` derives the project name from the first compose file's
#     directory, i.e. the seat clone's basename, and passes --project-name;
#   - a bare host-side `docker compose` in the clone derives the identical
#     name the same way;
#   - compose exposes that name to interpolation as ${COMPOSE_PROJECT_NAME}
#     (measured on Docker Compose 5.5.0, both with and without
#     --project-name).
# devcontainer.json's ${localWorkspaceFolderBasename} is the basename of
# --workspace-folder, which is that same clone directory, so the two resolve to
# the same string by construction. `cf-fleet doctor` asserts it rather than
# trusting it, because compose lowercases and strips the project name: a clone
# directory with capitals or dots would silently break the pairing.
services:
  devcontainer:
    build:
      # Repo-root-relative (see PATH RULE): `.` here would silently build
      # the repo's production Dockerfile instead.
      context: .devcontainer
      dockerfile: Dockerfile
    init: true
    # Chromium under docker defaults to a 64MB /dev/shm and tab-crashes under
    # Lighthouse's multi-page runs; 1GB removes that flake source in-container
    # (CI runners are unaffected - their /dev/shm is large).
    shm_size: 1gb
    # Cap the lane so ONE browser burst OOMs inside its own lane instead of
    # letting the VM's OOM killer take postgres or a sibling. This is a blast
    # radius limit, NOT a budget derived from the VM: 6g x 6 lanes is 36g
    # against a 16g VM, so it does not protect against several lanes bursting
    # at once - only against the single-burst case it was added for.
    mem_limit: 6g
    cap_add:
      - NET_ADMIN
      - NET_RAW
    network_mode: service:postgres
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      # Repo-root-relative (see PATH RULE): beware that `..` here WOULD
      # mount the parent of the repo (all of ~/code) into the container -
      # `.` below is correct and deliberate.
      - .:/workspaces/${COMPOSE_PROJECT_NAME:?compose must supply the project name}:delegated
      # The v2-ops coordination bus, shared by ALL seats. Mounted at the
      # same path shape as the host (~/careerforge-v2-ops) so seat docs
      # resolve identically in both worlds. Read-write on purpose: the bus
      # IS the sanctioned cross-seat channel (INBOX writes, DISPATCH flips);
      # it is git-versioned on the host, so any write is recoverable. This
      # widens the sandbox by exactly this one directory - egress policy and
      # the rest of the host stay unreachable. gh credentials deliberately
      # do NOT follow: merge ceremony runs on the host only.
      - ${HOME:?}/careerforge-v2-ops:/home/node/careerforge-v2-ops:delegated
      # The v-next dispatch STATE root (claims, generations, heartbeats, work
      # items, events - see careerforge-v2-ops CONTRACT). Lives OUTSIDE every
      # git worktree on purpose: a `git clean -fdx`/`git stash -a` in the ops
      # repo must never be able to delete claims or fence counters (verified
      # destructive on gitignored in-tree state, 2026-08-17). Same path shape
      # both worlds, like the ops bus above. Read-write: seats claim, heartbeat
      # and move work items here through the seat CLI + guard hooks.
      - ${HOME:?}/careerforge-state:/home/node/careerforge-state:delegated
      - claude-config:/home/node/.claude
      - shell-history:/commandhistory
      # Container-private node_modules: shadow every workspace package's
      # node_modules with a named volume. One node_modules cannot serve both
      # the macOS host and the Linux container: pnpm records the store path
      # and purges the whole dir on mismatch, stranding whichever side ran
      # install last (ERR_PNPM_ABORTED_REMOVE_MODULES_DIR_NO_TTY).
      - nm-root:/workspaces/${COMPOSE_PROJECT_NAME}/node_modules
      - nm-apps-api:/workspaces/${COMPOSE_PROJECT_NAME}/apps/api/node_modules
      - nm-apps-portfolio:/workspaces/${COMPOSE_PROJECT_NAME}/apps/portfolio/node_modules
      - nm-apps-web:/workspaces/${COMPOSE_PROJECT_NAME}/apps/web/node_modules
      - nm-packages-config:/workspaces/${COMPOSE_PROJECT_NAME}/packages/config/node_modules
      - nm-packages-core:/workspaces/${COMPOSE_PROJECT_NAME}/packages/core/node_modules
      - nm-packages-db:/workspaces/${COMPOSE_PROJECT_NAME}/packages/db/node_modules
      - nm-packages-llm:/workspaces/${COMPOSE_PROJECT_NAME}/packages/llm/node_modules
      - nm-packages-resume-render:/workspaces/${COMPOSE_PROJECT_NAME}/packages/resume-render/node_modules
      - nm-packages-scoring:/workspaces/${COMPOSE_PROJECT_NAME}/packages/scoring/node_modules
    environment:
      CLAUDE_CONFIG_DIR: /home/node/.claude
      # Carlos's wall clock (Oklahoma) for EVERY process in the seat - date,
      # git timestamps, logs, statusline. IANA zone, so daylight saving flips
      # automatically (CDT<->CST); never replace with a hardcoded offset.
      TZ: America/Chicago
      # Docker VM memory is a fraction of the host's; cap node heaps so
      # install-time build scripts can't blow past it (same cap the
      # reference devcontainer uses).
      NODE_OPTIONS: --max-old-space-size=3072
      # Keep pnpm's store INSIDE the container. The bind-mounted workspace is
      # a different filesystem from the container home, so pnpm would
      # otherwise relocate its store to .pnpm-store/ in the repo - which
      # leaks onto the host tree (and broke `prettier --check .`).
      npm_config_store_dir: /home/node/.pnpm-store
      # node_modules volumes are container-private, so a store-path change
      # purging them is always safe; without this, pnpm aborts for lack of a
      # TTY (ERR_PNPM_ABORTED_REMOVE_MODULES_DIR_NO_TTY).
      npm_config_confirm_modules_purge: 'false'
    command: sleep infinity

volumes:
  # PER-SEAT, deliberately unnamed: compose prefixes it with the project name,
  # so each clone gets its own <project>_claude-config. It used to carry an
  # explicit `name: careerforge-claude-config`, which made every seat mount ONE
  # volume. That single volume holds all of Claude Code's per-project state, so
  # with a shared /workspaces path on top of it the whole fleet collapsed into
  # one project directory: 73 pooled transcripts, one history.jsonl, one 46KB
  # .claude.json rewritten read-modify-write by six containers (last writer
  # wins), and every seat's session named identically, which made `--resume` a
  # coin flip. Splitting the volume is half the fix; the per-basename workspace
  # path above is the other half, because Claude Code keys its project state on
  # the workspace path.
  #
  # COST, stated rather than left to be discovered: one sign-in no longer
  # covers the fleet. .devcontainer/seed-claude-volume.sh copies the credential
  # (plus settings.json and statusline-command.sh) from the old shared volume
  # into each per-seat volume, host-side, before the fleet is recreated.
  claude-config:
  shell-history:
  nm-root:
  nm-apps-api:
  nm-apps-portfolio:
  nm-apps-web:
  nm-packages-config:
  nm-packages-core:
  nm-packages-db:
  nm-packages-llm:
  nm-packages-resume-render:
  nm-packages-scoring:
